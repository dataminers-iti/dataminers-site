    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {

            "@id": "https://dataminers.lat/#organization",

    <meta
      name="theme-color"
      content="#fff4e1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1a312c"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Paint the saved or system theme before first render (no flash).
      ;(function () {
        var t
        try {
          t = localStorage.getItem('dm-theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
